<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#09090c" />
    <title>Board admin — Open Matter Labs</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <style>
      .admin-wrap { max-width: 760px; }
      .admin-card { padding: 24px; border: 1px solid var(--line); background: var(--panel); margin-bottom: 20px; border-radius: var(--radius); }
      .admin-card h2 { font-family: var(--font-display); font-weight: 400; font-size: 1.5rem; margin-bottom: 14px; }
      .admin-card label { display: block; margin: 12px 0 4px; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
      .admin-card input[type="text"], .admin-card input[type="password"], .admin-card textarea {
        width: 100%; padding: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); font: inherit; border-radius: var(--radius);
      }
      .admin-card input[type="file"] { color: var(--muted); }
      .admin-card textarea { min-height: 110px; resize: vertical; }
      .admin-actions { margin-top: 14px; display: flex; gap: 10px; flex-wrap: wrap; }
      .admin-status { margin: 0 0 16px; font-size: .9rem; min-height: 1.2em; color: var(--muted); }
      .admin-status.ok { color: #6fbf73; }
      .admin-status.err { color: var(--signal); font-weight: 600; }
      .post-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
      .post-row:first-child { border-top: none; }
      .post-state { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase; flex: none; }
      .post-state.live { color: #6fbf73; }
      .post-state.hidden { color: var(--muted); }
      .post-title { font-weight: 500; flex: 1; }
      .post-row button { padding: 4px 10px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer; font: inherit; font-size: .8rem; border-radius: var(--radius); }
      .post-row button:hover { border-color: var(--signal); color: var(--signal); }
      .post-row button.danger:hover { border-color: hsl(0 62% 55%); color: hsl(0 62% 55%); }
      .token-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
      .token-row input { flex: 1; min-width: 220px; }
      .hint { color: var(--muted); font-size: .8rem; margin-top: 10px; }
      #image-preview-wrap { margin-top: 10px; display: flex; align-items: center; gap: 12px; }
      #image-preview { max-width: 180px; max-height: 120px; border: 1px solid var(--line); display: block; }
      .post-thumb { width: 64px; height: 40px; object-fit: cover; border: 1px solid var(--line); flex: none; }
    </style>
  </head>
  <body>
    <header class="site-header">
      <a class="wordmark" href="/">
        <span class="mark" aria-hidden="true">◈</span>
        <span>board admin</span>
      </a>
      <nav aria-label="Admin navigation">
        <a href="/">Public site</a>
      </nav>
    </header>

    <main class="section admin-wrap">
      <p class="mono-label"><span class="dot"></span>Board administration</p>
      <h1 style="font-family: var(--font-display); font-weight: 400; font-size: clamp(2.4rem, 6vw, 4rem); letter-spacing: -0.01em; margin: 8px 0 20px;">Board admin.</h1>
      <p class="admin-status" id="status" role="status" aria-live="polite"></p>

      <section class="admin-card" aria-labelledby="token-title">
        <h2 id="token-title">Session token</h2>
        <div class="token-row">
          <input type="password" id="token" autocomplete="off" placeholder="admin token" />
          <button class="button primary" id="unlock" type="button">Unlock</button>
          <button class="button quiet" id="lock" type="button">Lock</button>
        </div>
        <p class="hint">
          The token lives in this browser tab only (sessionStorage) and is never written
          to the page source or repository. It is checked server-side on every request.
        </p>
      </section>

      <section class="admin-card" aria-labelledby="new-title" hidden id="composer">
        <h2 id="new-title">New post</h2>
        <form id="post-form">
          <label for="f-title">Title</label>
          <input type="text" id="f-title" maxlength="120" required />
          <label for="f-body">Text</label>
          <textarea id="f-body" maxlength="2000" required></textarea>
          <label for="f-link">External link (optional)</label>
          <input type="text" id="f-link" maxlength="500" placeholder="https://…" />
          <label for="f-image">Image (optional — jpeg, png, webp, gif, avif; max 5 MiB)</label>
          <input type="file" id="f-image" accept="image/jpeg,image/png,image/webp,image/gif,image/avif" />
          <div id="image-preview-wrap" hidden>
            <img id="image-preview" alt="Selected image preview" />
            <button class="button quiet" type="button" id="image-clear">Remove image</button>
          </div>
          <div class="admin-actions">
            <button class="button primary" type="submit" id="publish-btn">Publish post</button>
          </div>
        </form>
      </section>

      <section class="admin-card" aria-labelledby="list-title" hidden id="posts-card">
        <h2 id="list-title">Posts</h2>
        <div id="posts-list"></div>
      </section>
    </main>

    <script src="admin.js" defer></script>
  </body>
</html>
